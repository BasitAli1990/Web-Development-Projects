<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <link rel="stylesheet" href="Application-form.css">
</head>
<body>
  <div class="form-section">
    <h1>Job Application Form</h1>
    <div class="form-elements">
      <form action="www.freecodecamp.org" method="post">
        <label for="full-name" class="text-box-label">Full Name:</label>
        <input type="text" name="full-name" id="full-name" placeholder="Enter your name" class="text-box" required>
        <label for="email" class="text-box-label">Email:</label>
        <input type="email" id="email" class="text-box" placeholder="Enter your email">
        <label for="position" class="text-box-label">Position:</label>
        <select name="position" id="position">
          <option value="select">Select a position</option>
          <option value="developer">Developer</option>
          <option value="developer">Designer</option>
          <option value="developer">Manager</option>
        </select>
        <fieldset>
          <legend>Availability</legend>
          <input type="radio" value="full-time" name="availability" id="availability" checked>
          <label for="full-time" class="radio-label">Full-Time</label>
          <input type="radio" value="part-time" name="availability" id="availability">
          <label for="part-time" class="part-time">Part-Time</label>
        </fieldset>
        <label for="text-box" class="text-box-label">Why do you want this job?</label>
        <textarea name="motivation" id="motivation" class="textarea" placeholder="Write your motivation" rows="5" cols="auto"></textarea>
        <input type="submit" name="submit" class="submit-btn" value="Submit Application">
      </form>
    </div>
  </div>
</body>
</html>
