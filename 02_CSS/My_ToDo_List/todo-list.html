<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ToDo List</title>
  <link rel="stylesheet" href="todo-list.css">
</head>
<body>
  <div class="container">
    <h1>My Todo List</h1>

    <div class="cell">
      <input type="checkbox" name="gamming-keyboard" id="gamming-keyboard" value="gamming-keyboard">
      <label for="gamming-keyboard">Explore gamming keyboards</label>
      <ul>
        <li><a href="https://www.example.com">Store Link</a></li>
      </ul>
    </div>

    <div class="cell">
      <input type="checkbox" name="report" id="report" value="report">
      <label for="report">Finish the report</label>
      <ul>
        <li><a href="https://www.example.com">Request Access</a></li>
      </ul>
    </div>

    <div class="cell">
      <input type="checkbox" name="warranty" id="warranty" value="warranty">
      <label for="warranty">View Phone's Warranty</label>
      <ul>
        <li><a href="https://www.example.com">View Receipts</a></li>
      </ul>
    </div>

    <div class="cell">
      <input type="checkbox" name="proceesor-specs" id="proceesor-specs" value="proceesor-specs">
      <label for="proceesor-specs">Check Processor Specs</label>
      <ul>
        <li><a href="https://www.example.com">View Model Number</a></li>
      </ul>
    </div>

  </div>
</body>
</html>
