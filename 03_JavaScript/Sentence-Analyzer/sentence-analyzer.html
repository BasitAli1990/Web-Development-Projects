<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence-Analyzer</title>
</head>
<body>
  <script>
    function getVowelCount(sentence){
      const vowels = "aeiou";
      let count = 0;

      for(const char of sentence.toLowerCase()){
        if (vowels.includes(char)){
          count++;
        }
      }
      return count;
    }

    const vowelCount = getVowelCount("Apples are tasty fruits");
    console.log(`Vowel Count: ${vowelCount}`);

    function getConstantCount(sentence) {
      const constants = "bcdfghjklmnpqrstvwxyz";
      let count = 0;
      
      for (const char of sentence.toLowerCase()) {
        if(constants.includes(char)){
          count++;
        }
      }
      return count;
    }

    const constantCount = getConstantCount("Coding is fun");
    console.log(`Constant Count: ${constantCount}`);

    function getPunctuationCount(sentence) {
      const punctuations = ".,!?;:-()[]{}\"'_";
      let count = 0;
      for(const char of sentence){
        if(punctuations.includes(char)){
        count++;
      }
      }
      return count;
    }

    const punctuationCount = getPunctuationCount("What?!?!?!?!");
    console.log(`Punctuation Count: ${punctuationCount}`);

    function getWordCount(sentence){
      return sentence.trim().split(/\s+/).length;
    }
    
    let wordCount = getWordCount("This is good day, lets learn javaScript!");
    console.log(`Word Count: ${wordCount}`);
  </script>
</body>
</html>
