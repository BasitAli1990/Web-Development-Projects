<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorial-Calculator</title>
</head>
<body>
  <script>
    let num = 56;
    function factorialCalculator(num){
      let result = 1;
      while(num>0)
        {
          result = result * num;
          num--;
        };
        return result; 
    }
    console.log(factorialCalculator(num));
  </script>
</body>
</html>
