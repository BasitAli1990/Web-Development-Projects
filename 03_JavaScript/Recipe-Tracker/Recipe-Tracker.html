<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe-Tracker</title>
</head>
<body>
  <script>
    const recipes = [];

    const recipe1 = {
      name: 'Spaghetti Carbonara',
      ingredients: ['spaghetti', 'Parmesan cheese', 'pacetta', 'black pepper'],
      cookingTime: 22,
      totalIngredients: null,
      difficultyLevel: '',
      ratings: [4, 5, 4, 5],
      averageRating: null,
    };

    const recipe2 = {
      name: 'Chicken Curry',
      ingredients: ['chicken breast', 'coconut milk', 'curry powder', 'onion', 'garlic'],
      cookingTime: 42,
      totalIngredients: null,
      difficultyLevel: '',
      ratings: [4, 5, 5, 5],
      averageRating: null,
    };

    const recipe3 = {
      name: 'Vegetable Stir Fry',
      ingredients: ['broccoli', 'carrot', 'bell pepper'],
      cookingTime: 15,
      totalIngredients: null,
      difficultyLevel: '',
      ratings: [4, 3, 4, 5],
      averageRating: null,
    };

    recipes.push(recipe1, recipe2, recipe3);

    function getAverageRating(ratings){
      const total = ratings[0] + ratings[1] + ratings[2] + ratings[3];
      return total / ratings.length;
    }

    function getTotalIngredients(ingredients) {
      return ingredients.length;
    }

    function getDifficultyLevel(cookingTime) {
      if(cookingTime <= 30) {
        return 'easy';
      } else if (cookingTime <= 60) {
        return 'medium';
      } else {
        return 'hard'; 
      }
    }

    const recipe1AverageRating = getAverageRating(recipe1.ratings);
    console.log(recipe1AverageRating);

    const recipe1TotalIngredients = getTotalIngredients(recipe1.ingredients);
    console.log(recipe1TotalIngredients);

    const recipe1DifficultyLevel = getDifficultyLevel(recipe1.cookingTime);
    console.log(recipe1DifficultyLevel);

    recipe2.averageRating = getAverageRating(recipe2.ratings);
    recipe2.totalIngredients = getTotalIngredients(recipe2.ingredients);
    recipe2.difficultyLevel = getDifficultyLevel(recipe2.cookingTime);

    recipe3.averageRating = getAverageRating(recipe3.ratings);
    recipe3.totalIngredients = getTotalIngredients(recipe3.ingredients)
    recipe3.difficultyLevel = getDifficultyLevel(recipe3.cookingTime)

    const recipe1Name = recipe1.name;
    console.log(recipe1Name);

    const recipe2Name = recipe2.name;
    console.log(recipe2Name);

    const recipe1CookingTime = recipe1.cookingTime;
    console.log(recipe1CookingTime);

    const recipe2CookingTime = recipe2.cookingTime;
    console.log(recipe2CookingTime);

    console.log(recipes);
  </script>
</body>
</html>
