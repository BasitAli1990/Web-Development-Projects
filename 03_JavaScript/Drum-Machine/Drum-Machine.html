<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Machine</title>
  <link rel="stylesheet" href="Drum-Machine.css">
</head>
<body>
  <div class="inner-container" id="drum-machine">
    <div id="pad-bank">
      <div class="drum-pad" id="Heater-1">Q</div>
      <div class="drum-pad" id="Heater-2">W</div>
      <div class="drum-pad" id="Heater-3">E</div>
      <div class="drum-pad" id="Heater-4">A</div>
      <div class="drum-pad" id="Clap">S</div>
      <div class="drum-pad" id="Open-HH">D</div>
      <div class="drum-pad" id="Kick-n'-Hat">Z</div>
      <div class="drum-pad" id="Kick">X</div>
      <div class="drum-pad" id="Closed-HH">C</div>
    </div>
    <div class="controls-container">
      <div class="control power-control">
        <p>Power:
          <span id="power-status">On</span>
        </p>
        <div class="select">
          <div class="inner"></div>
        </div>
      </div>
      <p id="display"></p>
      <div class="volume-slider">
        <input type="range" min="0" max="1" step="0.01" value="0.3">
      </div>
      <div class="control bank-control">
        <p>
          Bank:
          <span id="current-bank">Heater Kit</span>
        </p>
        <div class="select">
          <div class="inner"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="Drum-Machine.js"></script>
</body>
</html>
