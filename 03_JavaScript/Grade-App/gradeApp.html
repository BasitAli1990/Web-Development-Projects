<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade-App</title>
</head>
<body>
  <script>

    function getAverage(testScore)
    {
        let average = 0;
        let sum = 0;
        for(let i = 0; i < testScore.length; i++)
        {
          sum = sum + testScore[i];
        }
        average = sum / testScore.length;
        return average;
    }

    function getGrade(score)
    {
      let grade = " ";
      if(score === 100){
        grade = "A+ Grade";
      }
      else if(score>= 90 && score<=99){
        grade = "A Grade"
      }
      else if(score >= 80 && score >= 89){
        grade = "B Grade";
      }
      else if(score >= 70 && score <= 79){
        grade = "C Grade"
      }
      else if(score >= 60 && score <= 69){
        grade = "D Grade"
      }
      else if(score >= 0 && score <= 59){
        grade = "F Grade"
      }
      return grade;
    }

    function hasPassingGrade(score){
      if(score >= 60)
        return true;
      else
        return false;
    }

    function studentMsg(scores, singleScore)
    {
      let average = getAverage(scores);
      let grade = getGrade(singleScore);
      let resultMsg = " ";
      if(grade !== "F Grade")
        resultMsg = "You passed the course";
      else
        resultMsg = "You failed the course";
    
      console.log(`Class average: ${average}, Your grade: ${grade}.  ${resultMsg}`);
    }

    console.log(getAverage([92, 88, 12, 77, 57, 100, 67, 38, 97, 89]));
    console.log(getAverage([45, 87, 98, 100, 86, 94, 67, 88, 94, 95]));
    console.log(getAverage([38, 99, 87, 100, 100, 100, 100, 100, 100, 100]));

    console.log(getGrade(100));
    console.log(hasPassingGrade(55));
    console.log(studentMsg([60, 80, 78, 65, 85], 50));
  </script>
</body>
</html>
