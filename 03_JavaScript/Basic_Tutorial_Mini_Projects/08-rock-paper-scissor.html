<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button onclick="

        playGame('Rock');

      ">Rock</button>

    <button onclick="
        
        playGame('Paper');

    ">Paper</button>
    <button onclick="

        playGame('Scissors');

    ">Scissors</button>
    
    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
    ">Reset Score</button>
    <script>
      const score = JSON.parse(localStorage.getItem('score')) || {
          wins: 0,
          losses: 0,
          ties: 0
        };

      /*if(!score){ //!null return true
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        };
      }*/

      //console.log(localStorage.getItem('message'));
      //console.log(JSON.parse(localStorage.getItem('score')));
      //convert back into an object.


      function playGame(playerMove){

        const computerMove = pickComputerMove();

          console.log(computerMove);

          let result = '';

        if(playerMove === 'Scissors'){
          if(computerMove === 'Rock'){
            result = 'You Lose.';
          } else if(computerMove === 'Paper'){
            result = 'You Win.';
          }else if(computerMove === 'Scissors'){
            result = 'Tie.';
          }
        } 
          /////////////////
          else if(playerMove === 'Paper'){
          if(computerMove === 'Rock'){
            result = 'You Win.';
          } else if(computerMove === 'Paper'){
            result = 'Tie.';
          }else if(computerMove === 'Scissors'){
            result = 'You Lose.';
          }
        }
          ////////////////
          else if(playerMove === 'Rock'){

          if(computerMove === 'Rock'){
            result = 'Tie.';
          } else if(computerMove === 'Paper'){
            result = 'You Lose.';
          }else if(computerMove === 'Scissors'){
            result = 'You Win.';
          }
        }

        if(result === 'You Win.'){
          score.wins += 1;
        } else if(result === 'You Lose.'){
          score.losses += 1;
        } else if(result === 'Tie.'){
          score.ties += 1;
        }

        //localStorage.setItem('message','hello');//name + value
        //saving data in local storage

        localStorage.setItem('score',JSON.stringify(score));
        //local storage support only strings to convert an into string we have to use json.stringify

          alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
      }
      //let computerMove = '';

      function pickComputerMove(){

        randomNumber = Math.random();
        //console.log(Math.random());

        let computerMove = '';

        if(randomNumber >= 0 &&randomNumber < 1/3){
              computerMove =  'Rock';
        }else if(randomNumber >= 1/3 && randomNumber < 2/3){
              computerMove = 'Paper';
        }else if(randomNumber >= 2/3 && randomNumber < 1){
              computerMove = 'Scissors';
        }

        //return 5;
        //return 'rock';
        //return; //undefined stop code immediately. code after return never run

        return computerMove;

      }
    </script>
</body>
</html>
