<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    
</head>
<body>
<p>YouTube Subscribe Button</p>
<button onclick="

  subscribe();

" class="js-subscribe-button">
  Subscribe
</button>

<p>Amazon Shipping Calculator</p>

<input type="text" placeholder="Cost of order" class="js-cost-input" onkeydown="
  //console.log(event.key);

  handleCostKeydown(event);
">

<button onclick="

  calculateTotal();

" >Calculate</button>

<p class="js-total-cost"></p>
</body>
    <script>
      String(25); // convert a number to string
      console.log('25'-5);
       // automatic type conversion.
      console.log('25' + 5);

      //window is part of the browser.
      window.document;
      window.console.log('window');
      window.alert

      function handleCostKeydown(event){

        if(event.key === 'Enter'){
          
          calculateTotal();
          
        }
      }

      function calculateTotal(){
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value); //to convert a string to number.

        if(cost < 40){
          cost = cost + 10; //value obtained from dom is always a string.
        }

        document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
      }

      function subscribe(){
        const buttonElement = document.querySelector('.js-subscribe-button');
        if(buttonElement.innerText === 'Subscribe'){
          buttonElement.innerHTML = 'Subscribed';
        } else{
          buttonElement.innerHTML = 'Subscribe';
        }
      }
    </script>
</body>
</html>
