<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightbox viewer</title>
  <link rel="stylesheet" href="lightbox-viewer.css">
</head>
<body>
  <div class="header"><h1>Museum Gallery</h1></div>
  <div class="main">
    <img src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" alt="stonehenge landscpae with large stone structure" class="gallery-item">
    <img src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg" alt="A peaceful forest with tall trees." class="gallery-item">
    <img src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg" alt="a dramatic stromy sky with dark clouds and lightning." class="gallery-item">
  </div>

  <div class="overlay" id="fullscreenOverlay">
    <span class="close-btn" id="closeBtn">&times;</span>
    <img src="" alt="Fullscreen" id="fullscreenImg">
  </div>
 <script src="lightbox-viewer.js"></script> 
</body>
</html>
