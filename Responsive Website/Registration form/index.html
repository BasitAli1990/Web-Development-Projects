<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Registration Form</h1>
    <p>Please fill the form with required information.</p>
    <form action="https://register-demo.freecodecamp.org" method="get">
        <fieldset>
            <label for="first-name">Enter your First Name: <input type="text" id="first-name" required/></label>
            <label for="last-name">Enter your Last Name: <input type="text" id="last-name" required/></label>
            <label for="email">Enter your Email: <input type="email" id="email" required/></label>
            <label for="new-password">Create a new password: <input type="password" id="new-password"
                minlength="8" pattern="[a-z0-5]{8,}"required/></label>
        </fieldset>
        <fieldset>
            <legend>Account type (required)</legend>
            <label for="account-type"><input type="radio" name="account-type" id="personel-account" class="inline" checked/>Personal</label>
            <label for="account-type"><input type="radio" name="account-type" id="business-account" class="inline">Business</label>
        </fieldset>
        <fieldset>
            <label for="profile-picture">Upload a profile picture: <input type="file"/></label>
            <label for="age">Input ypur age (years): <input type="number" id="age" min="13" max="120"/></label>
            <label for="refferrer">How did you hear about us?
            <select name="" id="refferrer">
                <option value="">( select one)</option>
                <option value="1">freeCodeCamp News</option>
                <option value="2">freeCodeCamp YouTube Channel</option>
                <option value="3">freeCodeCamp Forum</option>
                <option value="4">Other</option>
            </select>
        </label>
        <label for="bio">Provide a bio:
            <textarea name="" id="bio" rows="3" cols="30"
            placeholder="I like coding on the beach...."></textarea>
        </label>
        </fieldset>
        <label for="terms-and-conditions"><input class="inline" type="checkbox" required>
            I accept the<a href="https://www.freecodecamp.org/news/terms-of-service/"> terms and conditions</a></label>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
