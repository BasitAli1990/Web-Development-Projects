<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freeCodeCamp Survey Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="titlle">freeCodeCamp Survey Form</h1>
            <p id="description">Thank you for taking the time to help us improve the platform.</p>
        </header>
        <section>
            <form action="www.freeCodeCamp.org" method="post" id="survey-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your Email" required>
                <label for="age">Age(optional)</label>
                <input type="number" min="13" max="120" name="age" placeholder="Age">
                <label for="role">Which option best describe your current role?</label>
                <select name="role" id="role">
                    <option value="select-current-role">Select current role</option>
                    <option value="student">Student</option>
                    <option value="full-time-job">Full time job</option>
                    <option value="full-time-learner">Full time learner</option>
                    <option value="not-to-say">Perfer not to say</option>
                    <option value="others">others</option>
                </select>
                <p>Would you recommend freeCodeCamp to a friend?</p>
                <label for="definitely" class="checkbox-label"><input type="radio" value="definitely" class="inline">Definitely</label>
                <label for="maybe" class="checkbox-label"><input type="radio" value="maybe" class="inline">Maybe</label>
                <label for="not-Sure" class="checkbox-label"><input type="radio" value="not-Sure" class="inline">Not sure</label>
                <p>What would you like to see improved? (Check all that apply) </p>
                <label for="front-end-projects" class="checkbox-label"><input type="checkbox" value="front-end-projects" class="inline">Front-end Projects</label>
                <label for="back-end-projects"><input type="checkbox" value="back-end-projects" class="inline">Back-end Projects</label>
                <label for="data-visualization">
                <input type="checkbox" value="data-visualization" class="inline">Data Visualization</label>
                <label for="challenges">
                <input type="checkbox" value="challenges" class="inline">Challenges</label>
                <label for="front-end-projects">
                <input type="checkbox" value="front-end-projects" class="inline">Front-end Projects</label>
                <p>Any Comments or suggestions?</p>
                <textarea name="Comments-suggestions" id="comments-suggestions" cols="20" rows="5" class="comments-area" placeholder="Enter your comments here"></textarea>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </section>
    </div>
</body>
</html>
