<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
</head>
<body>
  <section>
    <h1>Checkout</h1>
    <h2>Your Cart</h2>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/spoon.jpg" alt="Left hand spoon">

    <p>Left-handed spoon</p>
    <p>$29.99</p>
  </section>
  <section>
    <h2>Payment Information</h2>
    <form action="/submit-payment" method="POST">
      <div>
        <label for="card-name">Cardholder-Name</label>
        <input type="text" id="card-name" name="card-name" required aria-required="true">
      </div>
      <div>
        <label for="card-number">Card Number</label>
        <input type="number" id="card-number" name="card-number" required aria-required="true">
      </div>
      <div>
        <label for="expiry-date">Expiry Date</label>
        placeholder="MM/YY" required aria-required="true">
      </div>
    </div>
    <div>  
      <label for="CVV">CVV</label>
      <input type="date" id="cvv" name="cvv" required aria-required="true" aria-label="card verification value">
    </div>
    <div>
      <input type="submit" value="Place Order">
    </div>
    </form>
  </section>
</body>
</html>
